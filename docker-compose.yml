version: '3.9'

services:
  backend:
    build: .
    container_name: metar_backend
    restart: always
    working_dir: /app
    command: gunicorn app.backend.app:app --bind 0.0.0.0:5000

    volumes:
      - ./app/data:/app/data
    expose:
      - 5000

  nginx:
    image: nginx:latest
    container_name: metar_nginx
    restart: always
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./app/frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
