<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWO Mumbai - Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo-section">
                    <img src="./image.png" alt="MWO Logo" class="logo-image">
                    <div class="header-text">
                        <h1>MWO Mumbai</h1>
                        <p>ADMIN DASHBOARD</p>
                    </div>
                </div>
            </div>
            
                <div class="header-right">
                <button class="user-log-header" id="headerLogsBtn" title="View user logs">
                    <svg class="log-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span class="log-text">User Logs</span>
                </button>
                <div class="user-profile-wrapper">
                    <div class="user-profile" id="profileBtn">
                        <div class="profile-avatar">V</div>
                        <div class="profile-info">
                            <span class="profile-name">VABB</span>
                            <span class="profile-role">Super Admin</span>
                        </div>
                        <span class="dropdown-icon" aria-hidden="true">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                    </div>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="dropdown-header">
                            <div class="dropdown-avatar">V</div>
                            <div class="dropdown-info">
                                <p class="dropdown-name">VABB</p>
                                <p class="dropdown-role">Super Admin Account</p>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout-btn" id="logoutBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span>Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content-wrapper" style="grid-template-columns: 1fr;">
            <!-- Users Section (full width) -->
            <section class="section user-section" style="max-width:100%;">
                <div class="section-header">
                    <h2>USER</h2>
                    <button class="btn btn-add" id="addUserBtn" aria-label="Add user">
                        <span class="btn-icon" aria-hidden="true">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </span>
                        <span>Add User</span>
                    </button>
                </div>

                <div class="cards-container" style="grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap:20px;">
                    <!-- User Card 1 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VADD_User</h3>
                            <p class="card-subtitle">Station : VADD</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>

                    <!-- User Card 2 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VABB_User</h3>
                            <p class="card-subtitle">Station : VABB</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>

                    <!-- User Card 3 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VOCL_User</h3>
                            <p class="card-subtitle">Station : VOCL</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>

                    <!-- User Card 4 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VIDP_User</h3>
                            <p class="card-subtitle">Station : VIDP</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </div>

    <!-- Modal for Add User -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add User</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="modalForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="station">Station:</label>
                    <input type="text" id="station" name="station" placeholder="e.g., VADD, VABB" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-add">Add</button>
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script>
        // Admin Page JavaScript
        const modal = document.getElementById('modal');
        const modalForm = document.getElementById('modalForm');
        const addUserBtn = document.getElementById('addUserBtn');
        const notification = document.getElementById('notification');
        const userCardsContainer = document.querySelector('.user-section .cards-container');
        
        // Profile Dropdown
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');
        const logoutBtn = document.getElementById('logoutBtn');
        const headerLogsBtn = document.getElementById('headerLogsBtn');

        // Add User Button
        addUserBtn.addEventListener('click', () => {
            modalForm.reset();
            modal.classList.add('show');
        });

        // Form Submit
        modalForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const station = document.getElementById('station').value.trim();

            if (!name || !station) {
                showNotification('Please fill in all fields', 'error');
                return;
            }

            // Create new user card
            const newCard = document.createElement('div');
            newCard.className = 'card';
            newCard.innerHTML = `
                <div class="card-header">
                    <h3>${name}</h3>
                    <p class="card-subtitle">Station : ${station}</p>
                </div>
                <div class="card-status">
                    <span class="status-indicator active"></span>
                    <span class="status-text">Active</span>
                </div>
                <div class="card-actions">
                    <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                    <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                </div>
            `;
            
            userCardsContainer.appendChild(newCard);
            closeModal();
            showNotification(`User "${name}" added successfully!`);
        });

        // Close Modal
        function closeModal() {
            modal.classList.remove('show');
        }

        // Toggle Disable/Enable
        function toggleDisable(button) {
            const card = button.closest('.card');
            const statusIndicator = card.querySelector('.status-indicator');
            const statusText = card.querySelector('.status-text');
            const isActive = statusIndicator.classList.contains('active');

            if (isActive) {
                statusIndicator.classList.remove('active');
                statusIndicator.classList.add('disabled');
                statusText.textContent = 'Disabled';
                button.textContent = 'Enable';
                card.style.opacity = '0.6';
                showNotification('User disabled');
            } else {
                statusIndicator.classList.add('active');
                statusIndicator.classList.remove('disabled');
                statusText.textContent = 'Active';
                button.textContent = 'Disable';
                card.style.opacity = '1';
                showNotification('User enabled');
            }
        }

        // Delete Item
        function deleteItem(button) {
            if (confirm('Are you sure you want to delete this user?')) {
                const card = button.closest('.card');
                const name = card.querySelector('.card-header h3').textContent;
                card.remove();
                showNotification(`"${name}" deleted successfully`);
            }
        }

        // Show Notification
        function showNotification(message, type = 'success') {
            notification.textContent = message;
            notification.className = 'notification show';
            
            if (type === 'error') {
                notification.classList.add('error');
            }

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Profile Dropdown Toggle
        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle('show');
            profileBtn.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-profile-wrapper')) {
                profileDropdown.classList.remove('show');
                profileBtn.classList.remove('active');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            window.location.href = 'login.html';
        });

        // User Logs Button
        headerLogsBtn.addEventListener('click', () => {
            window.location.href = 'user_log.html';
        });

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('show')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
