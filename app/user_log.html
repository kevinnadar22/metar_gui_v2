<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Activity Log - MWO Mumbai</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header: copied from super_admin.html to keep theme -->
    <header class="header">
      <div class="header-left">
        <div class="logo-section">
          <img src="./image.png" alt="MWO Logo" class="logo-image">
          <div class="header-text">
            <h1>MWO Mumbai</h1>
            <p id="headerRoleSub">SUPER ADMIN DASHBOARD</p>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button class="user-log-header" id="backBtn" title="Back to dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span class="log-text">Back</span>
        </button>

        <div class="user-profile-wrapper">
          <div class="user-profile" id="profileBtn">
            <div class="profile-avatar">V</div>
            <div class="profile-info">
              <span class="profile-name">VABB</span>
              <span class="profile-role">Super Admin</span>
            </div>
            <span class="dropdown-icon" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </div>
          <div class="profile-dropdown" id="profileDropdown">
            <div class="dropdown-header">
              <div class="dropdown-avatar">V</div>
              <div class="dropdown-info">
                <p class="dropdown-name">VABB</p>
                <p class="dropdown-role">Super Admin Account</p>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-btn" id="logoutBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content-wrapper" style="grid-template-columns: 1fr;">
      <section class="section" style="min-height:600px;">
        <div style="text-align:center; margin-bottom:18px;">
          <h2 style="font-size:24px; margin:0;">USER ACTIVITY LOG</h2>
          <p style="color:#667085; margin-top:10px;">A descriptive body text comes here</p>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;">
          <div style="flex:1; max-width:520px;">
            <div class="search-box">
              <input id="searchInput" placeholder="Search" style="width:100%; padding:12px 16px; border-radius:8px; border:1px solid var(--color-border || #e5e7eb);" />
            </div>
          </div>

          <div style="display:flex; gap:10px;">
            <button class="btn" id="filtersBtn">Filters</button>
            <button class="btn" id="deleteSelectedBtn">Delete</button>
            <button class="btn" id="exportBtn">Export</button>
          </div>
        </div>

        <div class="table-card" style="background:white; border-radius:10px; padding:18px; box-shadow:0 6px 16px rgba(17,24,39,0.06);">
          <div style="overflow:auto;">
            <table id="logsTable" style="width:100%; border-collapse:collapse; min-width:1000px;">
              <thead>
                <tr style="text-align:left; color:#667085; font-weight:600; font-size:12px;">
                  <th style="padding:12px 8px;"><input type="checkbox" id="selectAll"></th>
                  <th style="padding:12px 8px;">User</th>
                  <th style="padding:12px 8px;">Station</th>
                  <th style="padding:12px 8px;">Action</th>
                  <th style="padding:12px 8px;">Timestamp</th>
                  <th style="padding:12px 8px;">Status</th>
                </tr>
              </thead>
              <tbody id="logsBody">
                <!-- rows injected by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </section>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
