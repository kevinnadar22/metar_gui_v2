<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWO Mumbai - Super Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo-section">
                    <img src="./image.png" alt="MWO Logo" class="logo-image">
                    <div class="header-text">
                        <h1>MWO Mumbai</h1>
                        <p>SUPER ADMIN DASHBOARD</p>
                    </div>
                </div>
            </div>
            
            <div class="header-right">
                <button class="user-log-header" id="headerLogsBtn" title="View user logs">
                    <svg class="log-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span class="log-text">User Logs</span>
                </button>
                <div class="user-profile-wrapper">
                    <div class="user-profile" id="profileBtn">
                        <div class="profile-avatar">V</div>
                        <div class="profile-info">
                            <span class="profile-name">VABB</span>
                            <span class="profile-role">Super Admin</span>
                        </div>
                        <span class="dropdown-icon" aria-hidden="true">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                    </div>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="dropdown-header">
                            <div class="dropdown-avatar">V</div>
                            <div class="dropdown-info">
                                <p class="dropdown-name">VABB</p>
                                <p class="dropdown-role">Super Admin Account</p>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout-btn" id="logoutBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span>Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content-wrapper">
            <!-- Admins Section -->
            <section class="section admin-section">
                <div class="section-header">
                    <h2>ADMINS</h2>
                    <button class="btn btn-add" id="addAdminBtn" aria-label="Add admin">
                        <span class="btn-icon" aria-hidden="true">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </span>
                        <span>Add Admin</span>
                    </button>
                </div>

                <div class="cards-container">
                    <!-- Admin Card 1 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VOCL</h3>
                            <p class="card-subtitle">Admin</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>

                    <!-- Admin Card 2 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VOCL2</h3>
                            <p class="card-subtitle">Admin</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Users Section -->
            <section class="section user-section">
                <div class="section-header">
                    <h2>USER</h2>
                    <button class="btn btn-add" id="addUserBtn" aria-label="Add user">
                        <span class="btn-icon" aria-hidden="true">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </span>
                        <span>Add User</span>
                    </button>
                </div>

                <div class="cards-container">
                    <!-- User Card 1 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VADD_User</h3>
                            <p class="card-subtitle">Station : VADD</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>

                    <!-- User Card 2 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VABB_User</h3>
                            <p class="card-subtitle">Station : VABB</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>

                    <!-- User Card 3 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>VOCL_User</h3>
                            <p class="card-subtitle">Station : VOCL</p>
                        </div>
                        <div class="card-status">
                            <span class="status-indicator active"></span>
                            <span class="status-text">Active</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-disable" onclick="toggleDisable(this)">Disable</button>
                            <button class="btn-action btn-delete" onclick="deleteItem(this)">Delete</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </div>

    <!-- Modal for Add Admin/User -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Admin</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="modalForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="station">Station/Role:</label>
                    <input type="text" id="station" name="station" placeholder="e.g., VADD, VABB">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-add">Add</button>
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
